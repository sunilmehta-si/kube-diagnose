# A claim asks for ReadWriteMany from kind's default StorageClass, whose node-local provisioner supports only ReadWriteOnce.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pvc-access-mode

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared
  namespace: kd-pvc-access-mode
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-pvc-access-mode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shared
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
