# The api connects to the database at 10.96.0.201, set in DB_HOST, and Service db has another cluster IP, so the connection fails and the api exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-service-ip-hardcoded

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-service-ip-hardcoded
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 5432 -h /www"]
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-service-ip-hardcoded
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-service-ip-hardcoded
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          # DB_HOST holds the address kubectl get service db showed once, before the Service was created again.
          env:
            - name: DB_HOST
              value: "10.96.0.201"
            - name: DB_PORT
              value: "5432"
          command: ["sh", "-c", "echo \"connecting to the database at $DB_HOST:$DB_PORT\"; wget -T 5 -O /dev/null \"http://$DB_HOST:$DB_PORT/\" || exit 1; sleep 3600"]
