# A Deployment sets minReadySeconds: 3600, meant as a timeout; its pods are ready within seconds but do not count as available for an hour, so it reports no available replicas and nothing says why.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-min-ready-seconds

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-min-ready-seconds
spec:
  replicas: 2
  minReadySeconds: 3600
  progressDeadlineSeconds: 7200
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
