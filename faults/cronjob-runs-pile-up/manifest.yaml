# A CronJob runs a report every minute with the default concurrencyPolicy, Allow, and each report takes an hour; every minute another run starts beside the ones still going, and they pile up.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-cronjob-runs-pile-up

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: kd-cronjob-runs-pile-up
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              command: ["sh", "-c", "echo building report; sleep 3600"]
