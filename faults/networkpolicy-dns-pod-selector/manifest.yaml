# The web pods' egress policy allows port 53 to pods labelled k8s-app: kube-dns with no namespaceSelector, which names pods of this namespace, not kube-system's, so no lookup gets out.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-networkpolicy-dns-pod-selector

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-networkpolicy-dns-pod-selector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-networkpolicy-dns-pod-selector
spec:
  selector:
    app: db
  ports:
    - name: http
      port: 80
      targetPort: "http"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-networkpolicy-dns-pod-selector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "while true; do echo 'calling db'; wget -q -T 5 -O /dev/null http://db/ || exit 1; sleep 5; done"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-db-and-dns
  namespace: kd-networkpolicy-dns-pod-selector
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - port: 8080
    # Meant to let lookups out to cluster Dkd-networkpolicy-dns-pod-selector; with no namespaceSelector, the podSelector names pods of this namespace.
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
