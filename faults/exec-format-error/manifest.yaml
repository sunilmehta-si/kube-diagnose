# The image is built for arm64 and the node is amd64 (CI's runners are amd64).
apiVersion: v1
kind: Namespace
metadata:
  name: kd-exec-format-error

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-exec-format-error
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox@sha256:d82c2ab94640ded77cf76514ce6a84870761105058a4a9e51b05a8a79be97a6c
          command: ["sleep", "3600"]
