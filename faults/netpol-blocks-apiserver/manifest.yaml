# An operator's pods sit behind a default-deny egress policy that allows only DNS; the API server is at its endpoint addresses on port 6443 once the Service is translated, so the operator's connection to kubernetes.default.svc times out and it exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-netpol-blocks-apiserver

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: kd-netpol-blocks-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      containers:
        - name: operator
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "wget -T 5 -O /dev/null --no-check-certificate https://kubernetes.default.svc/healthz || exit 1; sleep 3600"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-only
  namespace: kd-netpol-blocks-apiserver
spec:
  podSelector:
    matchLabels:
      app: operator
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
