# A Deployment's command is one string, "sleep 3600", so the runtime looks for an executable with that whole name and cannot start the container.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-command-one-string

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-command-one-string
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep 3600"]
