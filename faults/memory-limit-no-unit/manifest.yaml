# A Deployment sets memory: 512 as its limit, meaning 512 MiB; without a unit it is 512 bytes, so the runtime kills the container as it starts, every time.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-memory-limit-no-unit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-memory-limit-no-unit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            limits:
              memory: "512"
