# The namespace's LimitRange gives every container a default memory limit of 16Mi, and a worker that sets no limit of its own needs more, so it is OOMKilled again and again.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-limitrange-default-memory-oom

---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: kd-limitrange-default-memory-oom
spec:
  limits:
    - type: Container
      default:
        memory: 16Mi
      defaultRequest:
        memory: 8Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-limitrange-default-memory-oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "tail /dev/zero"]
