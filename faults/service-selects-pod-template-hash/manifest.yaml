# Service web selects app=web and pod-template-hash=5d9f7c6b8d, copied from a pod of an earlier rollout; the pods of the current ReplicaSet carry another hash, so the Service selects no pod.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-service-selects-pod-template-hash

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-service-selects-pod-template-hash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-service-selects-pod-template-hash
spec:
  # Copied from kubectl get pods --show-labels during an earlier rollout: the hash names that rollout's ReplicaSet.
  selector:
    app: web
    pod-template-hash: 5d9f7c6b8d
  ports:
    - port: 80
      targetPort: 8080
