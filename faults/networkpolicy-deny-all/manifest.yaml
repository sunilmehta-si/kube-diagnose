# A default-deny NetworkPolicy shuts off a Service's pods.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-networkpolicy-deny-all

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-networkpolicy-deny-all
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-networkpolicy-deny-all
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: "http"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kd-networkpolicy-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
