# A container mounts config.yaml from its ConfigMap with subPath, but the ConfigMap's key is config.yml; the kubelet makes an empty directory in its place, and the app exits reading it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-subpath-key-missing

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kd-subpath-key-missing
data:
  config.yml: |
    listen: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: kd-subpath-key-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "cat /etc/app/config.yaml || exit 1; exec sleep 3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: app-config
