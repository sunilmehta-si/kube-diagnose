# A container runs a script from a ConfigMap volume that sets no defaultMode, so the file is 0644 and the runtime cannot execute it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-script-not-executable

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scripts
  namespace: kd-script-not-executable
data:
  run.sh: |
    #!/bin/sh
    exec sleep 3600

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-script-not-executable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["/scripts/run.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: scripts
