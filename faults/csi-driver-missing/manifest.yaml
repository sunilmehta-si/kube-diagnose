# A database's volume belongs to a CSI driver that is registered in the API but runs on no node, so the volume never mounts and the pod stays in ContainerCreating.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-csi-driver-missing

---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.kd-faults.example.com
spec:
  attachRequired: false

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kd-csi-driver-missing
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  csi:
    driver: csi.kd-faults.example.com
    volumeHandle: vol-0001

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: kd-csi-driver-missing
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: kd-csi-driver-missing
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-csi-driver-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
