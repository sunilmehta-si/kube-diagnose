# A Deployment hardens its container with a Localhost seccomp profile, profiles/kd-hardened.json, that was never installed on the node, so containerd cannot create the container.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-seccomp-profile-missing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-seccomp-profile-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/kd-hardened.json
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
