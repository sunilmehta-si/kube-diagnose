# A container reads a key the Secret does not have.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-missing-secret-key

---
apiVersion: v1
kind: Secret
metadata:
  name: db
  namespace: kd-missing-secret-key
stringData:
  user: app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-missing-secret-key
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
