# A ResourceQuota limits limits.memory in the namespace and a Deployment sets requests only, so the API server refuses its pods for having no memory limit, though the quota is unused.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-quota-requires-limits

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: kd-quota-requires-limits
spec:
  hard:
    limits.memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-quota-requires-limits
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
