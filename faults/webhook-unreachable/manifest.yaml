# A validating webhook for pods points at a Service that does not exist and has failurePolicy: Fail, so the API server refuses every pod of the namespace though the webhook rejected nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-webhook-unreachable

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kd-webhook-unreachable
webhooks:
  - name: pods.policy.example.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    # Only this scenario's namespace: every namespace carries this label with its own name.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kd-webhook-unreachable
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:
      service:
        namespace: kd-webhook-unreachable
        name: policy
        path: /validate
        port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-webhook-unreachable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
