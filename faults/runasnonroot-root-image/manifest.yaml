# The pod requires a non-root user and the image runs as root, so the container is never created.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-runasnonroot-root-image

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-runasnonroot-root-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          securityContext:
            runAsNonRoot: true
