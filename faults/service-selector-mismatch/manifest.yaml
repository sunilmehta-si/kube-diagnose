# A Service selects app=web while its pods are labelled app=webapp.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-service-selector-mismatch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-service-selector-mismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-service-selector-mismatch
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: "http"
