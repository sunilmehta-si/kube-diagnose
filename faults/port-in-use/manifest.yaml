# A sidecar listens on the same port as the app in the same pod, so it exits with address in use.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-port-in-use

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-port-in-use
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080
        - name: metrics
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: metrics
              containerPort: 8080
