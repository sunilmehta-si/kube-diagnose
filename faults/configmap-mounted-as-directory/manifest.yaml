# ConfigMap app-config is mounted whole at /etc/app/config.yaml, the file the app reads, without subPath, so the path is a directory holding config.yaml and the app exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-configmap-mounted-as-directory

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kd-configmap-mounted-as-directory
data:
  config.yaml: |
    mode: production
    workers: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-configmap-mounted-as-directory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          # Reads its settings from /etc/app/config.yaml and reports a failed read as a Go program does.
          command: ["sh", "-c", "cfg=/etc/app/config.yaml; if [ -d \"$cfg\" ]; then echo \"error: read $cfg: is a directory\"; exit 1; fi; cat \"$cfg\"; sleep 3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/app/config.yaml
      volumes:
        - name: config
          configMap:
            name: app-config
