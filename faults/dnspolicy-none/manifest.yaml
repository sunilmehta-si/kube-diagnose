# An app sets dnsPolicy None with a public nameserver and its company's search domain, to reach outside names; with None its resolv.conf has only those, so the payments Service does not resolve and the app exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dnspolicy-none

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: kd-dnspolicy-none
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: kd-dnspolicy-none
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-dnspolicy-none
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["1.1.1.1"]
        searches: ["corp.example"]
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'calling payments:8080'; wget -q -T 2 -O /dev/null http://payments:8080/ || exit 1; sleep 3600"]
