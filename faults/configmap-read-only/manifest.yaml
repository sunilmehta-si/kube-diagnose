# A container rewrites a file of the ConfigMap volume it mounts, which the kubelet always mounts read-only, so it exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-configmap-read-only

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: kd-configmap-read-only
data:
  app.conf: |
    listen = 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-configmap-read-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'listen = 9090' > /etc/app/app.conf && sleep 3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/app
      volumes:
        - name: config
          configMap:
            name: app
