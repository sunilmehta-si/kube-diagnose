# The claim asks for four devices of gpu.example.com, and the driver offers two, so no node can satisfy it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dra-too-many-devices

---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.example.com
spec:
  selectors:
    - cel:
        expression: device.driver == "gpu.example.com"

---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: gpu-example-com-shared
spec:
  driver: gpu.example.com
  pool:
    name: shared
    generation: 1
    resourceSliceCount: 1
  # Network-attached devices, usable from every node: no driver runs, so the slice is published by hand.
  allNodes: true
  devices:
    - name: gpu-0
    - name: gpu-1

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-gpu
  namespace: kd-dra-too-many-devices
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.example.com
            count: 4

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: kd-dra-too-many-devices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      # Asks for four devices of gpu.example.com, and two are on offer.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: one-gpu
      containers:
        - name: trainer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            claims:
              - name: gpu
