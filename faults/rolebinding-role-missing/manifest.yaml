# A RoleBinding grants Role config-reader to the app ServiceAccount, but the Role in the namespace is named configmap-reader, so the binding grants nothing and the API server answers the worker with 403.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-rolebinding-role-missing

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: kd-rolebinding-role-missing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: kd-rolebinding-role-missing
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-config
  namespace: kd-rolebinding-role-missing
subjects:
  - kind: ServiceAccount
    name: app
    namespace: kd-rolebinding-role-missing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: kd-rolebinding-role-missing
data:
  mode: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-rolebinding-role-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: app
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          # Lists the namespace's ConfigMaps through the API, as an app that watches its settings does.
          command: ["sh", "-c", "wget -T 10 -O /dev/null --no-check-certificate --header \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\" https://kubernetes.default.svc/api/v1/namespaces/kd-rolebinding-role-missing/configmaps || exit 1; echo 'settings loaded'; sleep 3600"]
