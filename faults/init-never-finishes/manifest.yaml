# An init container waits for a database Service that does not exist, so the app never starts and nothing reports an error.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-init-never-finishes

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-init-never-finishes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://db:5432/; do echo 'waiting for db:5432'; sleep 5; done"]
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
