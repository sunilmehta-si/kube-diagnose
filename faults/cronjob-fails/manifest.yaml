# A CronJob runs every minute and every run fails because BACKUP_TARGET is not set.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-cronjob-fails

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: kd-cronjob-fails
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              command: ["sh", "-c", "echo 'starting backup'; echo 'ERROR: BACKUP_TARGET is not set'; exit 2"]
