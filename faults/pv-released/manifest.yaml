# A PersistentVolume kept by reclaim policy Retain still carries the reference to its deleted claim, so it is Released and the new claim that fits it stays Pending.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pv-released

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kd-pv-released
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: kd-pv-released
    name: old-data
    uid: 0f6f1d7e-3a52-4c8e-9d1b-6f2c8a7e4b11
  hostPath:
    path: /tmp/kd-pv-released
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: kd-pv-released
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-pv-released
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
