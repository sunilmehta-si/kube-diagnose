# An init container waits until Service web answers, but the only pods behind that Service are this Deployment's own, which cannot serve until the init container exits: each waits for the other and the workload never starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-init-waits-for-own-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-init-waits-for-own-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-for-web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://web/; do echo 'waiting for web'; sleep 5; done"]
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-init-waits-for-own-service
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
