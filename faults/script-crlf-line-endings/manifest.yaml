# The worker runs start.sh from ConfigMap worker-scripts, which was saved with Windows line endings, so the shell reads cd /tmp with a carriage return and the script fails.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-script-crlf-line-endings

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-scripts
  namespace: kd-script-crlf-line-endings
data:
  # Saved on Windows: every line ends in CRLF.
  start.sh: "#!/bin/sh\r\necho \"starting the worker\"\r\ncd /tmp\r\nexec sleep 3600\r\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-script-crlf-line-endings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "/scripts/start.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: worker-scripts
