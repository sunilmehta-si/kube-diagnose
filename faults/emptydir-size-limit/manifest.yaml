# A container writes 20 MiB into an emptyDir with a 10 MiB sizeLimit, so the kubelet evicts its pods.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-emptydir-size-limit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-emptydir-size-limit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "dd if=/dev/zero of=/cache/blob bs=1M count=20 && sleep 3600"]
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 10Mi
