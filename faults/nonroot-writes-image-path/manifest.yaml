# A pod runs as user 1000 and its start command creates /www in the image, where only root may write, so the container exits with permission denied.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-nonroot-writes-image-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-nonroot-writes-image-path
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
