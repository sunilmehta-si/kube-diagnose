# A pod sets dnsPolicy Default, so it resolves with the node's DNS, cannot find the api Service, and exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dnspolicy-default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-dnspolicy-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/etc"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kd-dnspolicy-default
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: kd-dnspolicy-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      dnsPolicy: Default
      containers:
        - name: client
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "wget -q -T 5 -O /dev/null http://api.kd-dnspolicy-default.svc.cluster.local/hostname && sleep 3600"]
