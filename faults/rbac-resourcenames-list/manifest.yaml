# Role settings-reader grants get, list and watch on the ConfigMap named settings only (resourceNames), and the app lists and watches the namespace's ConfigMaps, which names no object, so the API server refuses it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-rbac-resourcenames-list

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: kd-rbac-resourcenames-list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: settings-reader
  namespace: kd-rbac-resourcenames-list
rules:
  # Meant to let the app read the one ConfigMap that holds its settings.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["settings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-settings-reader
  namespace: kd-rbac-resourcenames-list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: settings-reader
subjects:
  - kind: ServiceAccount
    name: app
    namespace: kd-rbac-resourcenames-list
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: kd-rbac-resourcenames-list
data:
  mode: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-watcher
  namespace: kd-rbac-resourcenames-list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-watcher
  template:
    metadata:
      labels:
        app: config-watcher
    spec:
      serviceAccountName: app
      containers:
        - name: watcher
          image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
          # Watches the namespace's ConfigMaps, as an app that reloads its settings does.
          args: ["get", "configmaps", "--watch"]
