# A container uses more memory than its limit.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-oomkilled

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "tail /dev/zero"]
          resources:
            limits:
              memory: 32Mi
