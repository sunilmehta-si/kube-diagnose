# A three-replica StatefulSet's first pod never passes its readiness probe, so the StatefulSet never creates the other two.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-statefulset-first-pod-unready

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-statefulset-first-pod-unready
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: db
      port: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: kd-statefulset-first-pod-unready
spec:
  serviceName: db
  replicas: 3
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 5
