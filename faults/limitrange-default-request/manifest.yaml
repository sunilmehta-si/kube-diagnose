# The namespace's LimitRange gives every container a default cpu request of 64, which no node has, and the Deployment sets no request of its own.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-limitrange-default-request

---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: kd-limitrange-default-request
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "64"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-limitrange-default-request
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
