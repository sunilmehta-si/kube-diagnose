# Service api selects app=api, the labels on Deployment api itself, while its pods carry app=api-server, so the Service selects no pod.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-service-selects-deployment-labels

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-service-selects-deployment-labels
  # The Deployment's own labels: the Service below selects these, and they never reach the pods.
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kd-service-selects-deployment-labels
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
