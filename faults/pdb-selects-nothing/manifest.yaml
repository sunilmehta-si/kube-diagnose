# A PodDisruptionBudget selects app=frontend while the pods are app=web, so it protects nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pdb-selects-nothing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-pdb-selects-nothing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: kd-pdb-selects-nothing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
