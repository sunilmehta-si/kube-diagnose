# A Deployment's image tag does not exist.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-bad-image-tag

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-bad-image-tag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:0.0.0-kube-diagnose-missing
          command: ["sleep", "3600"]
