# An app connects to Service db, whose Deployment is scaled to 0, so the connection is refused and the app exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-service-refused

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-service-refused
spec:
  replicas: 0
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-service-refused
spec:
  selector:
    app: db
  ports:
    - name: http
      port: 80
      targetPort: "http"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-service-refused
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'calling db'; wget -q -T 5 -O /dev/null http://db/ || exit 1; sleep 3600"]
