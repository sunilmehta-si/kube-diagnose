# The readiness probe asks for a path the server does not have, so the pods never get traffic.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-readiness-failing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-readiness-failing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-readiness-failing
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: "http"
