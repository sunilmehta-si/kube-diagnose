# Job train is created suspended with label kueue.x-k8s.io/queue-name: team-a, as Kueue's docs say, on a cluster where Kueue is not installed, so nothing ever admits or unsuspends it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-kueue-not-installed

---
apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: kd-kueue-not-installed
  # Written for the GPU cluster, where Kueue admits Jobs from LocalQueue team-a; this cluster has no Kueue.
  labels:
    kueue.x-k8s.io/queue-name: team-a
spec:
  suspend: true
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo training; sleep 30"]
