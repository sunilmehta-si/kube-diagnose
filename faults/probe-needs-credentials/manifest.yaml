# The app puts every path behind basic auth, the health path included; the kubelet's readiness probe sends no credentials and is answered 401, so the pod never becomes ready.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-probe-needs-credentials

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-probe-needs-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/healthz && echo '/:admin:example' > /etc/httpd.conf && exec httpd -f -p 8080 -h /www -c /etc/httpd.conf"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
