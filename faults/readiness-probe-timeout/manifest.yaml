# The readiness probe runs a health check that takes about three seconds, and it gives up after its default timeoutSeconds of 1, so the pod never becomes ready.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-readiness-probe-timeout

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-readiness-probe-timeout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            # The health check also checks the database, which takes about three seconds to answer.
            exec:
              command: ["sh", "-c", "sleep 3; wget -q -O /dev/null http://127.0.0.1:8080/"]
            periodSeconds: 5
