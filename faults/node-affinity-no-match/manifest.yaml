# The pods require node affinity kubernetes.io/arch In arm64, and kind's node is amd64, so the scheduler places them on no node.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-node-affinity-no-match

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-node-affinity-no-match
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Keeps the pods on arm64 nodes, as a manifest written for a cluster of arm64 nodes does.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
