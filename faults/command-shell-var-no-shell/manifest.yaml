# A Deployment runs ["sleep", "$SLEEP_SECONDS"] with SLEEP_SECONDS in its env; there is no shell to expand $SLEEP_SECONDS, so sleep gets the literal text and exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-command-shell-var-no-shell

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-command-shell-var-no-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "$SLEEP_SECONDS"]
          env:
            - name: SLEEP_SECONDS
              value: "3600"
