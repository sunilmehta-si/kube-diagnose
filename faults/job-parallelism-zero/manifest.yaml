# A Job sets parallelism 0, so it starts no pods and never completes, and nothing reports an error.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-job-parallelism-zero

---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: kd-job-parallelism-zero
spec:
  parallelism: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo migrated"]
