# A Service of type LoadBalancer on a cluster with no load balancer implementation never gets an external address.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-loadbalancer-pending

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-loadbalancer-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-loadbalancer-pending
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: "http"
