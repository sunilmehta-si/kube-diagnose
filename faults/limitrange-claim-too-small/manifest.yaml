# The namespace's LimitRange sets a 1Gi minimum per PersistentVolumeClaim, and StatefulSet db's volumeClaimTemplates ask for 100Mi, so the claim of db-0 is refused and the pod is never created.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-limitrange-claim-too-small

---
apiVersion: v1
kind: LimitRange
metadata:
  name: storage-bounds
  namespace: kd-limitrange-claim-too-small
spec:
  limits:
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-limitrange-claim-too-small
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 8080

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: kd-limitrange-claim-too-small
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
