# An app reaches its database through an ExternalName Service, db, that points at orders-db.invalid; the name does not resolve, so the CNAME cluster DNS answers with leads nowhere and the app exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-externalname-unresolved

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-externalname-unresolved
spec:
  type: ExternalName
  externalName: orders-db.invalid

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-externalname-unresolved
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'connecting to db'; wget -q -T 2 -O /dev/null http://db:5432/ || exit 1; sleep 3600"]
