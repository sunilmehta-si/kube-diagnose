# A Deployment pins its pods with nodeName to a node the cluster does not have, so nothing runs them and nothing says why.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-nodename-missing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-nodename-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeName: kd-worker-9
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
