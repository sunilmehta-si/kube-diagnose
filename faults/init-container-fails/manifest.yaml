# An init container fails, so the app never starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-init-container-fails

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-init-container-fails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'FATAL: cannot reach db:5432'; exit 2"]
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
