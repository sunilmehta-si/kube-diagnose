# A pod's nodeSelector matches no node.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-node-selector

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-node-selector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        disktype: ssd
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
