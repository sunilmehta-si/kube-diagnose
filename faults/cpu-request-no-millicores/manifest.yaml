# A Deployment asks for cpu: 500, meaning half a core; without the m suffix it is 500 cores, which no node has, so the pod is never scheduled.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-cpu-request-no-millicores

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-cpu-request-no-millicores
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "500"
              memory: 64Mi
