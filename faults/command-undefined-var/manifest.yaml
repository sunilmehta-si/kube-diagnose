# A Deployment runs ["sleep", "$(SLEEP_SECONDS)"] but its env defines SLEEP_SECOND; the kubelet passes the literal $(SLEEP_SECONDS), and sleep exits on it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-command-undefined-var

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-command-undefined-var
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "$(SLEEP_SECONDS)"]
          env:
            - name: SLEEP_SECOND
              value: "3600"
