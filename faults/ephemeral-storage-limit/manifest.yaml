# A container writes 50 MiB to its local disk with a 10 MiB ephemeral-storage limit and is evicted.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-ephemeral-storage-limit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-ephemeral-storage-limit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "dd if=/dev/zero of=/tmp/fill bs=1M count=50 && sleep 3600"]
          resources:
            limits:
              ephemeral-storage: 10Mi
