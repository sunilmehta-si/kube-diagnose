# The log agent's pods use PriorityClass system-node-critical, copied from a kube-system manifest, and outside kube-system no ResourceQuota admits it, so none is created.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-priority-system-critical

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-agent
  namespace: kd-priority-system-critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      # Copied from a kube-system add-on's manifest; outside kube-system no quota admits this priority.
      priorityClassName: system-node-critical
      containers:
        - name: agent
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
