# A Deployment's pods carry a scheduling gate that no controller removes, so they stay Pending with no events and no error.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-scheduling-gate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-scheduling-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      schedulingGates:
        - name: example.com/quota-check
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
