# The toolbox Deployment runs busybox with no command; its default is sh, which with no terminal exits 0 at once, so the pod restarts for ever.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-shell-nothing-to-do

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: kd-shell-nothing-to-do
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
    spec:
      containers:
        # A toolbox to exec into, made with kubectl create deployment and no command: busybox's default is sh.
        - name: toolbox
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
