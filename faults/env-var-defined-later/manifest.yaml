# A container's API_URL is built from $(API_HOST), but API_HOST is defined below it in the env list; the kubelet expands only variables defined earlier, so the app gets the literal text and fails to resolve it.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-env-var-defined-later

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-env-var-defined-later
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kd-env-var-defined-later
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-env-var-defined-later
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo \"fetching $API_URL\"; wget -q -T 5 -O /dev/null \"$API_URL\" || exit 1; sleep 3600"]
          env:
            - name: API_URL
              value: "http://$(API_HOST):8080/"
            - name: API_HOST
              value: api
