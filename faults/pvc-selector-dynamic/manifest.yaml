# Claim data has a selector, tier=fast, and asks StorageClass standard, whose provisioner does not provision for a claim with a selector, so the claim stays Pending.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pvc-selector-dynamic

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: kd-pvc-selector-dynamic
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  # Copied from a claim that bound to a hand-made volume; standard's provisioner does not provision for a selector.
  selector:
    matchLabels:
      tier: fast
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: kd-pvc-selector-dynamic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
