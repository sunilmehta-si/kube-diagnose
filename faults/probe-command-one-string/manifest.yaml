# A readiness probe has its command line as one item, "cat /tmp/ready", so the kubelet looks for a program with that whole name, every probe errors, and the pod never becomes ready.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-probe-command-one-string

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-probe-command-one-string
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && touch /tmp/ready && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["cat /tmp/ready"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-probe-command-one-string
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
