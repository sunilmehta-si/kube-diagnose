# A command is written as a list, echo starting && sleep 3600, with no shell: && is one more argument to echo, which prints it and exits, so sleep never runs and the container restarts forever.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-command-shell-operator-no-shell

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-command-shell-operator-no-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["echo", "starting", "&&", "sleep", "3600"]
