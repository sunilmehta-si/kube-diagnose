# The claim selects devices whose model attribute is v6e, and the driver offers two v5e devices, so its selector matches none.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dra-selector-no-match

---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tpu.example.com
spec:
  selectors:
    - cel:
        expression: device.driver == "tpu.example.com"

---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: tpu-example-com-shared
spec:
  driver: tpu.example.com
  pool:
    name: shared
    generation: 1
    resourceSliceCount: 1
  # Network-attached devices, usable from every node: no driver runs, so the slice is published by hand.
  allNodes: true
  devices:
    - name: tpu-0
      attributes:
        model:
          string: v5e
    - name: tpu-1
      attributes:
        model:
          string: v5e

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-gpu
  namespace: kd-dra-selector-no-match
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: tpu.example.com
            selectors:
              - cel:
                  expression: device.attributes["tpu.example.com"].model == "v6e"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: kd-dra-selector-no-match
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      # Asks for a v6e device, and the driver's devices are v5e.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: one-gpu
      containers:
        - name: trainer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            claims:
              - name: gpu
