# The indexer pod sets a 64Mi memory limit for the whole pod (spec.resources) and none on its containers; the indexer grows past it and is OOMKilled again and again.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-oom-pod-level-limit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: kd-oom-pod-level-limit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      # Pod-level resources: one budget for both containers, and no limit on either.
      resources:
        limits:
          memory: 64Mi
      containers:
        - name: indexer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "tail /dev/zero"]
        - name: metrics
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
