# A Deployment puts its server flags under command, not args: command replaces the image entrypoint, so the runtime looks for a program named --port=8080 and the container never starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-flags-in-command

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-flags-in-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["--port=8080", "--root=/www"]
          ports:
            - name: http
              containerPort: 8080
