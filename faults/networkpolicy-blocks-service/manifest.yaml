# An egress NetworkPolicy lets the app resolve names but reach nothing else, so its connection to the db Service times out and it exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-networkpolicy-blocks-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-networkpolicy-blocks-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-networkpolicy-blocks-service
spec:
  selector:
    app: db
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-networkpolicy-blocks-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "while true; do wget -T 5 -O /dev/null http://db/ || exit 1; sleep 5; done"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-only
  namespace: kd-networkpolicy-blocks-service
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
