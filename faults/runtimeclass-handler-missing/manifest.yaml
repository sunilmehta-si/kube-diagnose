# A Deployment runs with RuntimeClass kd-nvidia, whose handler nvidia exists on GPU nodes only; the kind node's containerd has no such runtime, so the pod's sandbox is never created.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-runtimeclass-handler-missing

---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kd-nvidia
handler: nvidia

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infer
  namespace: kd-runtimeclass-handler-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infer
  template:
    metadata:
      labels:
        app: infer
    spec:
      runtimeClassName: kd-nvidia
      containers:
        - name: infer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
