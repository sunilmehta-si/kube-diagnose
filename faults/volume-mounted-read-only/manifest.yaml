# A container writes to a volume its mount sets readOnly: true, so it exits with read-only file system.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-volume-mounted-read-only

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-volume-mounted-read-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: seed
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo seeded > /data/seed"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo started > /data/started && sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
