# A Deployment's pods have a readiness gate that no controller in the cluster sets, so they run with every container ready but never become Ready, and their Service has no endpoints.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-readiness-gate-unset

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-readiness-gate-unset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      readinessGates:
        - conditionType: example.com/lb-registered
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-readiness-gate-unset
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
