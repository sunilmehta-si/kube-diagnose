# A worker is configured to reach its cache at 127.0.0.1:6379, as on a developer's machine; in the cluster the cache runs in another pod behind a Service, so the connection to the pod's own loopback is refused.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-localhost-for-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: kd-localhost-for-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 6379 -h /www"]
          ports:
            - name: cache
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: kd-localhost-for-service
spec:
  selector:
    app: cache
  ports:
    - name: cache
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kd-localhost-for-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "wget -T 5 -O /dev/null \"$CACHE_URL\" || exit 1; sleep 3600"]
          env:
            - name: CACHE_URL
              value: "http://127.0.0.1:6379/"
