# An Indexed Job's two workers set subdomain: workers and look each other up as train-0.workers and train-1.workers, but there is no headless Service named workers, so the names never resolve and each worker exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-subdomain-no-headless-service

---
apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: kd-subdomain-no-headless-service
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      subdomain: workers
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "if [ \"$JOB_COMPLETION_INDEX\" = 0 ]; then peer=train-1; else peer=train-0; fi; echo \"rank $JOB_COMPLETION_INDEX waiting for $peer.workers\"; wget -q -T 2 -O /dev/null http://$peer.workers:29500/ || exit 1; sleep 3600"]
