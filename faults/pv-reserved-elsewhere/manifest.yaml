# A claim names a PersistentVolume that is reserved for another claim, so it stays Pending with no event, and the database that mounts it never starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pv-reserved-elsewhere

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kd-pv-reserved-elsewhere
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  claimRef:
    namespace: kd-pv-reserved-elsewhere
    name: old-data
  hostPath:
    path: /tmp/kd-pv-reserved-elsewhere

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: kd-pv-reserved-elsewhere
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: kd-pv-reserved-elsewhere
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-pv-reserved-elsewhere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
