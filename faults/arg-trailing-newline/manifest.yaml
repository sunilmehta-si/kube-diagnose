# Deployment web passes its config path as an args item written as a YAML literal block (- |), which keeps a newline at its end, so cat looks for /etc/app/app.conf with a line break in its name and the container exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-arg-trailing-newline

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: kd-arg-trailing-newline
data:
  app.conf: |
    listen 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-arg-trailing-newline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "cat \"$0\" > /dev/null && exec httpd -f -p 8080 -h /etc/app"]
          # A literal block keeps the newline at its end: the path the shell gets is "/etc/app/app.conf\n".
          args:
            - |
              /etc/app/app.conf
          volumeMounts:
            - name: config
              mountPath: /etc/app
      volumes:
        - name: config
          configMap:
            name: web-config
