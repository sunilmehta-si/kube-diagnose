# A CronJob runs every minute with concurrencyPolicy Forbid, and its first run never ends, so every later run is skipped.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-cronjob-forbid-overlap

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: kd-cronjob-forbid-overlap
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              command: ["sh", "-c", "echo building the report; sleep 3600"]
