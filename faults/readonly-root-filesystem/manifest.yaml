# A container with a read-only root filesystem creates a directory in it at start and exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-readonly-root-filesystem

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-readonly-root-filesystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir /cache && sleep 3600"]
          securityContext:
            readOnlyRootFilesystem: true
