# The node agent runs on the host network and listens on 10250, which the kubelet holds on every node, so the bind fails and it exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-hostnetwork-port-taken

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  namespace: kd-hostnetwork-port-taken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      # On the node's network, to see its traffic; its metrics port collides with the kubelet's.
      hostNetwork: true
      containers:
        - name: agent
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/metrics && exec httpd -f -p 10250 -h /www"]
          ports:
            - containerPort: 10250
