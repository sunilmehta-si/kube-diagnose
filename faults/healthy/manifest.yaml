# Control: a working Deployment and Service. Every finding here is a false alarm.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-healthy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-healthy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kd-healthy
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: "http"

---
# A working Gateway and HTTPRoute in front of the Service, so the Gateway API rules are held to no false alarm too.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  # The suite's class, shared by its Gateway scenarios; no controller runs it.
  name: kd-faults
spec:
  controllerName: example.com/kd-faults

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: kd-healthy
spec:
  gatewayClassName: kd-faults
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: kd-healthy
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames: ["web.example.com"]
  rules:
    - backendRefs:
        - name: web
          port: 80
