# An app reads /etc/app/config.yaml, but its ConfigMap's key is config.yml, so the file is not in the volume and the app exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-configmap-file-missing

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: kd-configmap-file-missing
data:
  config.yml: |
    listen: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-configmap-file-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "cat /etc/app/config.yaml && sleep 3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/app
      volumes:
        - name: config
          configMap:
            name: app
