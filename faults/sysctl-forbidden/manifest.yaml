# A Redis pod sets the sysctl net.core.somaxconn, which the kubelet does not allow by default, so it rejects the pod with SysctlForbidden and the pod never runs.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-sysctl-forbidden

---
apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: kd-sysctl-forbidden
  labels:
    app: redis
spec:
  securityContext:
    sysctls:
      - name: net.core.somaxconn
        value: "1024"
  containers:
    - name: redis
      image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
      ports:
        - containerPort: 6379
