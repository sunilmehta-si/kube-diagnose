# A Deployment's pods set the sysctl net.core.somaxconn, which the kubelet does not allow by default, so it rejects every pod with SysctlForbidden.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-sysctl-forbidden

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-sysctl-forbidden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        sysctls:
          - name: net.core.somaxconn
            value: "1024"
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
