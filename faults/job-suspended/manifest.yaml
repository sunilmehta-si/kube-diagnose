# A Job was created suspended and never resumed, so it runs no pods and reports no error.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-job-suspended

---
apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: kd-job-suspended
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo training; sleep 30"]
