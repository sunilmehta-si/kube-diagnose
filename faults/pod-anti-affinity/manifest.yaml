# Two replicas require different nodes (pod anti-affinity) on a one-node cluster, so the second is never scheduled.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-pod-anti-affinity

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-pod-anti-affinity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: web
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
