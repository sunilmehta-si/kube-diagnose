# A volume mounts a ConfigMap that does not exist, so the pod never starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-missing-configmap-volume

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-missing-configmap-volume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      volumes:
        - name: config
          configMap:
            name: nginx-conf
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
