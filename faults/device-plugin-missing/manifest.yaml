# A Deployment's pods request an extended resource that no node advertises, because no device plugin provides it, so they stay Pending.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-device-plugin-missing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: train
  namespace: kd-device-plugin-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: train
  template:
    metadata:
      labels:
        app: train
    spec:
      containers:
        - name: train
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            requests:
              example.com/accelerator: "1"
            limits:
              example.com/accelerator: "1"
