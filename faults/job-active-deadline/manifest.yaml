# A Job has activeDeadlineSeconds: 30 and its work takes longer, so the Job controller ends its running pod at 30 seconds and fails the Job; no pod is left and nothing crashed.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-job-active-deadline

---
apiVersion: batch/v1
kind: Job
metadata:
  name: export
  namespace: kd-job-active-deadline
spec:
  activeDeadlineSeconds: 30
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      containers:
        - name: export
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo 'exporting 400000 rows'; sleep 600; echo done"]
