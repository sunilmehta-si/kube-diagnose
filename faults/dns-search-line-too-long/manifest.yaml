# Deployment web lists 32 search domains in its dnsConfig, one per team, and with the cluster's own they are more than a resolver reads, so the kubelet drops the last and short names in those domains no longer resolve.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dns-search-line-too-long

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-dns-search-line-too-long
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # One search domain per team, so that each team's short names resolve; the list grew to the 32 allowed.
      dnsConfig:
        searches:
          - team1.corp.example.com
          - team2.corp.example.com
          - team3.corp.example.com
          - team4.corp.example.com
          - team5.corp.example.com
          - team6.corp.example.com
          - team7.corp.example.com
          - team8.corp.example.com
          - team9.corp.example.com
          - team10.corp.example.com
          - team11.corp.example.com
          - team12.corp.example.com
          - team13.corp.example.com
          - team14.corp.example.com
          - team15.corp.example.com
          - team16.corp.example.com
          - team17.corp.example.com
          - team18.corp.example.com
          - team19.corp.example.com
          - team20.corp.example.com
          - team21.corp.example.com
          - team22.corp.example.com
          - team23.corp.example.com
          - team24.corp.example.com
          - team25.corp.example.com
          - team26.corp.example.com
          - team27.corp.example.com
          - team28.corp.example.com
          - team29.corp.example.com
          - team30.corp.example.com
          - team31.corp.example.com
          - team32.corp.example.com
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
