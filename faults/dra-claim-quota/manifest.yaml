# ResourceQuota dra-claims allows no ResourceClaims in the namespace, so the claim for the trainer pod cannot be made from its template and the pod waits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dra-claim-quota

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dra-claims
  namespace: kd-dra-claim-quota
spec:
  hard:
    # The team's quota leaves no room for device claims.
    count/resourceclaims.resource.k8s.io: "0"

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-gpu
  namespace: kd-dra-claim-quota
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.example.com

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: kd-dra-claim-quota
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: one-gpu
      containers:
        - name: trainer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            claims:
              - name: gpu
