# Each trainer pod is to get its claim from ResourceClaimTemplate single-gpu, which does not exist, so no claim is made and the pod waits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-dra-claim-template-missing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: kd-dra-claim-template-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      # Each pod's claim is to be made from ResourceClaimTemplate single-gpu, which does not exist.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: single-gpu
      containers:
        - name: trainer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            claims:
              - name: gpu
