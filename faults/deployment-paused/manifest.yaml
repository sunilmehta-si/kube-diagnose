# A Deployment was created paused and never resumed, so it has no ReplicaSet and no pods, and nothing reports an error.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-deployment-paused

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-deployment-paused
spec:
  paused: true
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
