# An HPA scales on CPU utilization in a cluster without a metrics API, so it never scales.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-hpa-no-metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-hpa-no-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: kd-hpa-no-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
