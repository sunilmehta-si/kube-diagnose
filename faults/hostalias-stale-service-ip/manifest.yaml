# The api reaches the database by the name db, but its pod's hostAliases pin db to 10.96.255.250, the Service's address before it was created again; /etc/hosts is read before DNS, so the connection goes nowhere and the api exits.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-hostalias-stale-service-ip

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: kd-hostalias-stale-service-ip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 5432 -h /www"]
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kd-hostalias-stale-service-ip
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kd-hostalias-stale-service-ip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Added while the database moved, with the address kubectl get service db showed then; the Service has since
      # been created again and has another cluster IP.
      hostAliases:
        - ip: "10.96.255.250"
          hostnames: ["db"]
      containers:
        - name: api
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo connecting to the database at db:5432; wget -T 5 -O /dev/null http://db:5432/ || exit 1; sleep 3600"]
