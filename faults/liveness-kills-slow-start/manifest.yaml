# The server needs about a minute to load before it listens on 8080, and its liveness probe, with no startupProbe, gives up after 20 seconds, so the kubelet kills it every time before it starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-liveness-kills-slow-start

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: kd-liveness-kills-slow-start
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: server
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          # Loads its model for about a minute before it serves, as an inference server does.
          command: ["sh", "-c", "echo 'loading model weights'; sleep 45; echo 'warming the cache'; sleep 15; mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
