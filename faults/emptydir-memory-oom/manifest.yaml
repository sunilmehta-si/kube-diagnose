# A container writes 64 MiB into a memory-backed emptyDir with a 32 MiB memory limit; tmpfs pages count against the limit, so it is OOMKilled, and the file outlives each restart.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-emptydir-memory-oom

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: kd-emptydir-memory-oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: warm
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["dd", "if=/dev/zero", "of=/cache/blob", "bs=1M", "count=64"]
          resources:
            limits:
              memory: 32Mi
          volumeMounts:
            - name: cache
              mountPath: /cache
        - name: serve
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            medium: Memory
