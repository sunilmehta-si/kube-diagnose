# A postStart hook runs a script that is not in the image, so the kubelet kills the container each time it starts.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-poststart-hook-fails

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-poststart-hook-fails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "/opt/warm-cache.sh"]
