# A headless Service (clusterIP: None) maps port 80 to targetPort 8080 for web servers on 8080; with no proxy to map it, clients that dial peers:80 reach the pods on port 80 and are refused.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-headless-port-remap

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer
  namespace: kd-headless-port-remap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: peer
  template:
    metadata:
      labels:
        app: peer
    spec:
      containers:
        - name: peer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: peers
  namespace: kd-headless-port-remap
spec:
  clusterIP: None
  selector:
    app: peer
  ports:
    - name: http
      port: 80
      targetPort: 8080
