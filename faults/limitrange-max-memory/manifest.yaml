# A LimitRange caps containers at 64 MiB and the Deployment asks for a 128 MiB limit, so no pod is created.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-limitrange-max-memory

---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-caps
  namespace: kd-limitrange-max-memory
spec:
  limits:
    - type: Container
      max:
        memory: 64Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-limitrange-max-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]
          resources:
            limits:
              memory: 128Mi
