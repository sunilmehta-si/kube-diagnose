# A NetworkPolicy meant for the web pods selects app=webapp, a label no pod has, so it restricts nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: kd-networkpolicy-selects-nothing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kd-networkpolicy-selects-nothing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sleep", "3600"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: kd-networkpolicy-selects-nothing
spec:
  podSelector:
    matchLabels:
      app: webapp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
